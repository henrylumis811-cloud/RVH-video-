name: RVH Video Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rvh-video-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          # GitHub's current runner publishes API 37 as android-37.0, while
          # AGP resolves numeric compileSdk 37 through android-37.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          adb version
          sdkmanager --list_installed | grep -E 'platforms;android-37(\.0)?|build-tools;36.0.0|platform-tools' || true

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Run unit tests
        if: ${{ success() }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: rvh-video-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: rvh-video-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Publish latest release APK
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rvh-video-latest"
          RELEASE_DIR="app/build/outputs/apk/release"
          APK="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          STABLE_APK="$RELEASE_DIR/RVH-Video-latest.apk"

          if [ -z "$APK" ]; then
            echo "Release APK not found. Contents of release output:"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi

          # Always publish the same asset name so the download URL never changes.
          cp "$APK" "$STABLE_APK"
          echo "Publishing APK: $STABLE_APK"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Convert any earlier prerelease into the real Latest release.
            gh release edit "$TAG" \
              --title "RVH Video — Latest Release Build" \
              --prerelease=false \
              --latest
            gh release upload "$TAG" "$STABLE_APK" --clobber
          else
            gh release create "$TAG" "$STABLE_APK" \
              --title "RVH Video — Latest Release Build" \
              --notes "Latest production release build generated by GitHub Actions from the main branch." \
              --latest
          fi

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/RVH-Video-latest.apk"
          LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/RVH-Video-latest.apk"
          echo "Direct download: $DOWNLOAD_URL"
          echo "Latest download: $LATEST_URL"
          {
            echo "## RVH Video — Latest Release APK"
            echo
            echo "[Download RVH-Video-latest.apk]($DOWNLOAD_URL)"
            echo
            echo "[Open latest release page](https://github.com/${GITHUB_REPOSITORY}/releases/latest)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvh-video-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
